<svg
  xmlns="http://www.w3.org/2000/svg"
  width="500"
  height="500"
  viewBox="0 0 500 500"
  fill="none"
  color="#1a1a1a"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Logo 1 — De la J a la flor</title>
  <desc id="description">
    Se dibuja una J, se cierra el primer pétalo y se añaden siete pétalos por la izquierda.
  </desc>

  <defs>
    <path
      id="j-line"
      pathLength="1"
      d="M 0 0
         V 107
         C 0 149 -24 171 -61 171
         C -90 171 -108 155 -112 131"
    />

    <path
      id="closing-curve"
      pathLength="1"
      d="M -112 131
         C -130 65 -78 0 0 0"
    />

    <g id="completed-petal">
      <use href="#j-line" />
      <use href="#closing-curve" />
    </g>
  </defs>

  <g
    transform="translate(250 250)"
    stroke="currentColor"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Paso 1: se dibuja la J. -->
    <use
      href="#j-line"
      stroke-dasharray="1"
      stroke-dashoffset="1"
    >
      <animate
        attributeName="stroke-dashoffset"
        values="1;0"
        keyTimes="0;1"
        keySplines="0.42 0 0.58 1"
        calcMode="spline"
        dur="0.9s"
        fill="freeze"
      />
    </use>

    <!-- Paso 2: la punta se une con el inicio y cierra el primer pétalo. -->
    <use
      href="#closing-curve"
      stroke-dasharray="1"
      stroke-dashoffset="1"
    >
      <animate
        attributeName="stroke-dashoffset"
        values="1;0"
        keyTimes="0;1"
        keySplines="0.42 0 0.58 1"
        calcMode="spline"
        begin="1.1s"
        dur="0.7s"
        fill="freeze"
      />
    </use>

    <!-- Paso 3: se añaden los pétalos por la izquierda. -->
    <g transform="rotate(45) rotate(112.5) scale(1 -1) rotate(-112.5)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="2s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="2s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(90)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="2.25s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="2.25s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(135) rotate(112.5) scale(1 -1) rotate(-112.5)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="2.5s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="2.5s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(180)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="2.75s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="2.75s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(225) rotate(112.5) scale(1 -1) rotate(-112.5)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="3s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="3s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(270)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="3.25s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="3.25s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>

    <g transform="rotate(315) rotate(112.5) scale(1 -1) rotate(-112.5)">
      <g opacity="0" transform="scale(0.05)">
        <use href="#completed-petal" />
        <animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.22s" fill="freeze" />
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.05;1"
          begin="3.5s"
          dur="0.28s"
          fill="freeze"
        />
      </g>
    </g>
  </g>
</svg>
